name: Diagnose full Freeroam FunCity Engine

on:
  workflow_dispatch:
  push:
    branches:
      - arena/f933ec78-funcity
    paths:
      - .github/workflows/diagnose-funcity-engine.yml
      - scripts/diagnose-funcity-engine.ps1

permissions:
  contents: read

concurrency:
  group: funcity-engine-full-pack-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only full-pack startup diagnosis on KERNELOS-PC
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Inspect the engine logs and process state only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "Diagnostic workflow source revision: $env:GITHUB_SHA"
          & .\scripts\diagnose-funcity-engine.ps1 -ServerPath 'E:\Administrator\Desktop\FunCity\FunCity server\FunCity-Engine-Freeroam'
