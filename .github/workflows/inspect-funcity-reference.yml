name: Inspect FunCity reference server

on:
  push:
    branches:
      - arena/f933ec78-funcity
    paths:
      - .github/workflows/inspect-funcity-reference.yml
      - scripts/inspect-funcity-reference.ps1
      - scripts/inspect-mrpack.ps1

permissions:
  contents: read

jobs:
  inspect-reference:
    name: Read-only inventory on KERNELOS-PC
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Inventory the two requested folders
        id: scan
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $reference = 'E:\Administrator\Desktop\FunCity\servere referinta'
          $destination = 'E:\Administrator\Desktop\FunCity\FunCity server'
          $reportDirectory = Join-Path $env:GITHUB_WORKSPACE 'runner-report'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null
          $failed = $false

          try {
            if (-not (Test-Path -LiteralPath $reference -PathType Container)) {
              throw "Runner cannot access the reference folder: $reference"
            }
            if (-not (Test-Path -LiteralPath $destination -PathType Container)) {
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
            }

            & .\scripts\inspect-funcity-reference.ps1 -ReferencePath $reference -DestinationPath $destination
            Copy-Item -LiteralPath (Join-Path $destination 'funcity-reference-inventory.txt') -Destination $reportDirectory -Force
            Copy-Item -LiteralPath (Join-Path $destination 'funcity-reference-inventory.json') -Destination $reportDirectory -Force

            $pack = $null
            $projectRoot = Split-Path -Parent $reference
            $skipNames = @('.git', 'assets', 'backups', 'cache', 'crash-reports', 'libraries', 'logs', 'mods', 'plugins', 'saves', 'world', 'world_nether', 'world_the_end')
            $searchRoots = @($projectRoot, $reference, $destination) | Select-Object -Unique
            foreach ($searchRoot in $searchRoots) {
              $queue = [System.Collections.Generic.Queue[string]]::new()
              $queue.Enqueue($searchRoot)
              $visited = 0
              while ($queue.Count -gt 0 -and $visited -lt 5000 -and $null -eq $pack) {
                $current = $queue.Dequeue()
                $visited++
                $match = Get-ChildItem -LiteralPath $current -File -Filter 'Freeroam 1.0.0.mrpack' -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($null -ne $match) {
                  $pack = $match
                  break
                }
                $children = Get-ChildItem -LiteralPath $current -Directory -Force -ErrorAction SilentlyContinue
                foreach ($child in $children) {
                  if ($skipNames -notcontains $child.Name) { $queue.Enqueue($child.FullName) }
                }
              }
              if ($null -ne $pack) { break }
            }
            if ($null -eq $pack) {
              throw 'Freeroam 1.0.0.mrpack was not found under either supplied folder.'
            }

            & .\scripts\inspect-mrpack.ps1 -PackPath $pack.FullName -OutputDirectory $destination
            Copy-Item -LiteralPath (Join-Path $destination 'freeroam-pack-info.txt') -Destination $reportDirectory -Force
            Copy-Item -LiteralPath (Join-Path $destination 'freeroam-pack-info.json') -Destination $reportDirectory -Force

            # Return the inventory to the agent encrypted. The repository is public;
            # only the ciphertext is emitted as a check annotation. The private key
            # remains outside the repository and never reaches the runner.
            $reportParts = [System.Collections.Generic.List[string]]::new()
            $referenceReport = Join-Path $destination 'funcity-reference-inventory.txt'
            if (Test-Path -LiteralPath $referenceReport -PathType Leaf) {
              $reportParts.Add('=== Existing server inventory ===')
              $reportParts.Add((Get-Content -LiteralPath $referenceReport -Raw))
            }
            $packReport = Join-Path $destination 'freeroam-pack-info.txt'
            $reportParts.Add('=== Freeroam pack inventory ===')
            $reportParts.Add((Get-Content -LiteralPath $packReport -Raw))
            $reportText = $reportParts -join "`n"
            if ($reportText.Length -gt 80000) {
              $reportText = $reportText.Substring(0, 80000) + "`n[Inventory truncated]"
            }

            $publicKeyXml = '<RSAKeyValue><Modulus></Modulus><Exponent>AQAB</Exponent></RSAKeyValue>'
            $rsa = New-Object System.Security.Cryptography.RSACryptoServiceProvider
            $aes = [System.Security.Cryptography.Aes]::Create()
            try {
              $rsa.FromXmlString($publicKeyXml)
              $aes.KeySize = 256
              $aes.GenerateKey()
              $aes.GenerateIV()
              $plainBytes = [System.Text.Encoding]::UTF8.GetBytes($reportText)
              $encryptor = $aes.CreateEncryptor()
              try {
                $cipherBytes = $encryptor.TransformFinalBlock($plainBytes, 0, $plainBytes.Length)
              }
              finally {
                $encryptor.Dispose()
              }
              $payloadObject = [ordered]@{
                key = [Convert]::ToBase64String($rsa.Encrypt($aes.Key, $true))
                iv = [Convert]::ToBase64String($aes.IV)
                ciphertext = [Convert]::ToBase64String($cipherBytes)
              }
              $payload = ConvertTo-Json -InputObject $payloadObject -Compress
              $payloadBase64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($payload))
              $chunkSize = 3000
              $chunkCount = [int][Math]::Ceiling($payloadBase64.Length / [double]$chunkSize)
              for ($index = 0; $index -lt $chunkCount; $index++) {
                $start = $index * $chunkSize
                $length = [Math]::Min($chunkSize, $payloadBase64.Length - $start)
                $chunk = $payloadBase64.Substring($start, $length)
                $title = 'FCINV-' + $index.ToString('D2') + '-' + $chunkCount.ToString('D2')
                Write-Host "::notice title=$title::$chunk"
              }
            }
            finally {
              $aes.Dispose()
              $rsa.Dispose()
            }

            $successMessage = 'Reference scan and Freeroam pack inspection completed. No jar was executed and no pack files were modified.'
            Set-Content -LiteralPath (Join-Path $reportDirectory 'status.txt') -Value $successMessage -Encoding UTF8
            Set-Content -LiteralPath (Join-Path $destination 'freeroam-pack-status.txt') -Value $successMessage -Encoding UTF8
          }
          catch {
            $failed = $true
            $safeMessage = 'Inventory could not be completed: ' + $_.Exception.Message
            Set-Content -LiteralPath (Join-Path $reportDirectory 'status.txt') -Value $safeMessage -Encoding UTF8
            if (Test-Path -LiteralPath $destination -PathType Container) {
              Set-Content -LiteralPath (Join-Path $destination 'freeroam-pack-status.txt') -Value $safeMessage -Encoding UTF8
            }
            Write-Host $safeMessage
          }

          "scan_failed=$($failed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Mark an inaccessible folder as a failed scan
        if: steps.scan.outputs.scan_failed == 'true'
        shell: powershell
        run: |
          throw 'The runner could not scan the requested folders. See runner-report/status.txt on this branch.'
